apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
spec:
  replicas: 1
  selector:
    matchLabels:
      name: result-app-pod
      app: voting-app-proj 
  strategy:
    type: RollingUpdate
  template:
    metadata:
      name: result-app-pod
      labels:
        name: result-app-pod
        app: voting-app-proj  
    spec:
      containers:
      - name: result-app-container
        image: dockersamples/examplevotingapp_result
        ports:
        - containerPort: 80
