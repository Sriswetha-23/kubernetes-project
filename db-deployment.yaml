apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      name: db-pod
      app: voting-app-proj 
  strategy:
    type: RollingUpdate
  template:
    metadata:
      name: db-pod
      labels:
        name: db-pod
        app: voting-app-proj  
    spec:
      containers:
      - name: db-container
        image: postgres:15-alpine
        env: 
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: db-data
      volumes:
      - name: db-data
        emptyDir: {}


